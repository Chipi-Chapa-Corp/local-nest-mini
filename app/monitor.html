<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Nest Mini</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 21c0-7 5.8-12 13-12s13 5 13 12c0 1.7-1.3 3-3 3H6c-1.7 0-3-1.3-3-3z' fill='%23d9dbe3'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#0f1117;--card:rgba(255,255,255,.04);--card-line:rgba(255,255,255,.08);
  --text:#e9ebf3;--muted:#9097ab;--faint:#5d6378;
  --a1:#8b7cf6;--a2:#5fa8f5;--ok:#5fd4a0;--bad:#f27a8a;
}
@media (prefers-color-scheme:light){:root{
  color-scheme:light;
  --bg:#f6f6fb;--card:rgba(255,255,255,.75);--card-line:rgba(30,30,60,.08);
  --text:#1e2030;--muted:#6b7086;--faint:#a5a9bb;
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(900px 500px at 10% -10%,rgba(139,124,246,.16),transparent 60%),
             radial-gradient(800px 500px at 100% 0%,rgba(95,168,245,.12),transparent 60%),var(--bg)}
header{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:14px 28px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--card-line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.brand svg{width:34px;height:34px}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(95,212,160,.15);animation:breathe 2.4s ease-in-out infinite}
.live{color:var(--text)}.down .dot{background:var(--bad)}
.actions{display:flex;justify-content:flex-end;gap:6px}
.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.icon:hover{background:var(--card);border-color:var(--card-line);color:var(--text)}
.icon svg{width:18px;height:18px}
main{max-width:1180px;margin:0 auto;padding:28px 28px 64px}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 14px}
section+section{margin-top:36px}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:18px;backdrop-filter:blur(8px)}
.empty{color:var(--muted);padding:22px}
.task{padding:18px 22px;margin-bottom:12px}
.task-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px;margin-bottom:14px}
.flow{display:flex;flex-direction:column}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-heading h2{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 11px;border:1px solid var(--card-line);border-radius:9px;background:var(--card);color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--a1) 12%,var(--bg));border-color:var(--a1)}.btn:disabled{cursor:default;opacity:.45}
.btn svg,.task-top svg{width:15px;height:15px;flex:none}.primary{color:var(--a2);border-color:color-mix(in srgb,var(--a2) 35%,transparent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--a2);outline-offset:3px}
.task-kind{display:inline-flex;align-items:center;gap:7px;color:var(--text);font-weight:500}.task-info{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.step-content{min-width:0;flex:1;padding-bottom:18px}.step:last-child .step-content{padding-bottom:0}.stage-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}.recording{color:var(--bad)}.notice{color:var(--bad);font-size:13px;margin-top:8px;overflow-wrap:anywhere}
.request-icon{width:16px;height:16px;flex:none;color:var(--a2);margin-top:2px}.request-icon.error{color:var(--bad)}
.chevron{width:14px;height:14px;color:var(--faint);flex:none;margin-top:3px;transition:transform .15s}details[open] .chevron{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
.step{position:relative;min-width:0;display:flex;align-items:flex-start;gap:12px}
.step:not(:last-child)::before{content:"";position:absolute;left:13px;top:31px;bottom:4px;width:1px;background:var(--card-line)}
.node{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--faint);background:var(--card)}
.node svg{width:16px;height:16px}.done .node{color:var(--ok);background:rgba(95,212,160,.08)}
.loading .node{color:var(--a2);background:rgba(95,168,245,.08)}.loading .node svg{animation:spin 1.2s linear infinite}
.error .node{color:var(--bad);background:rgba(242,122,138,.08)}.waiting .node{color:var(--a2)}
.step.recording .node{color:var(--bad);background:rgba(242,122,138,.08)}
.label{min-width:0;padding-top:3px;font-size:14px;color:var(--text);overflow-wrap:anywhere}
.pending .label,.skipped .label{color:var(--faint)}.error .label{color:var(--bad)}
.label q{color:var(--muted)}.label q::before,.label q::after{content:'"'}
.err{margin-top:14px;padding:10px 14px;border-radius:12px;background:rgba(242,122,138,.1);color:var(--bad);font-size:14px;overflow-wrap:anywhere}
.more{display:block;margin:4px auto 0;padding:8px 16px;border-radius:10px;border:1px solid var(--card-line);background:var(--card);color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.more:hover{color:var(--text)}
details{border-bottom:1px solid var(--card-line)}details:last-child{border-bottom:0}
summary{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:12px 20px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--card)}
.what{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{color:var(--muted);font-size:13px}
.when{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
details[open] .what{white-space:normal}
pre{margin:0;padding:4px 20px 16px;color:var(--muted);font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{box-shadow:0 0 0 7px rgba(95,212,160,0)}}
@media (max-width:860px){
  header{padding:12px 16px}main{padding:20px 16px 48px}
  .task{padding:16px}.task-info{gap:8px}.when{font-size:12px}summary{padding:12px;gap:9px}.brand{font-size:14px}.status{font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eceef4"/><stop offset="1" stop-color="#b6bac7"/></linearGradient></defs>
      <path d="M3 21c0-7 5.8-12 13-12s13 5 13 12c0 1.7-1.3 3-3 3H6c-1.7 0-3-1.3-3-3z" fill="url(#fabric)"/>
      <circle cx="11.5" cy="15.5" r="1.4" fill="#5fa8f5"/><circle cx="14.5" cy="15.5" r="1.4" fill="#f27a8a"/>
      <circle cx="17.5" cy="15.5" r="1.4" fill="#f5c46b"/><circle cx="20.5" cy="15.5" r="1.4" fill="#5fd4a0"/>
    </svg>
    Local Nest Mini
  </div>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting</span></div>
  <div class="actions">
    <button class="icon" id="pause" title="Pause" aria-label="Pause updates"></button>
    <button class="icon" id="refresh" title="Refresh" aria-label="Refresh"></button>
  </div>
</header>
<main>
  <section><div class="section-heading"><h2>Pipelines</h2><button class="btn primary" id="test"></button></div><div id="test-notice" class="notice" role="status"></div><div id="tasks"></div></section>
  <section><h2>Recent requests</h2><div id="requests" class="card"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
function icon(name,cls=""){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="icons.svg#${name}"></use></svg>`}
const LANG={en:"English",ru:"Russian"};
const state={paused:false,showAll:false,open:new Set(),last:{},tasks:[],recording:null,starting:null,uploading:null,playing:null,messages:new Map()};
const player=new Audio();
const MAX_RECORDING_MS=60000;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function q(text){const t=String(text??""),s=t.length>70?t.slice(0,68).trimEnd()+"…":t;return `<q title="${esc(t)}">${esc(s)}</q>`}
function clock(ts){return new Date(ts*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function secs(a,b){return a&&b?`${(b-a).toFixed(1)} s`:""}

function steps(task){
  const by=Object.fromEntries((task.stages||[]).map(s=>[s.name,s]));
  const test=task.meta?.source==="browser_test";
  const finished=!["loading","waiting"].includes(task.status);
  const tr=by.transcribe?.detail||{},pr=by.process?.detail||{},out=by.output?.detail||{},tts=by.tts?.detail||{};
  const defs=[
    ["received",test?"mic":"cast",test?"Recording received":"Received input from Nest",test?"Uploading recording…":"Receiving input from Nest…",test?"Recording":"Waiting for Nest"],
    ["transcribe","text-align-start",tr.text?`Transcribed input: ${q(tr.text)}`:"Heard nothing","Transcribing…","Transcribe"],
    ["process","sparkles",`Generated response: ${q(pr.response)} in ${esc(LANG[pr.lang]||pr.lang||"auto")}`,"Generating response…","Generate response"],
    ["tts","audio-lines",tts.engine?`Converted to audio with ${esc(tts.engine)}`:"Converted to audio",tts.engine?`Converting to audio with ${esc(tts.engine)}…`:"Converting to audio…","Convert to audio"],
    ["output",test?"volume-2":"cast",test?(out.transport==="browser"?"Played in browser":"Cast to Nest"):out.result?"Closed quietly, nothing to say":"Spoken via Nest",test?"Casting to Nest…":"Sending to Nest…",test?"Playback":"Speak via Nest"],
  ];
  return defs.map(([name,glyph,done,loading,idle])=>{
    const st=by[name];
    let cls=st?st.status:(finished?"skipped":"pending"),label;
    if(cls==="done")label=done;
    else if(cls==="loading")label=loading;
    else if(cls==="error")label=`${esc(idle)} failed`;
    else if(cls==="interrupted"){cls="error";label="Interrupted";}
    else label=cls==="skipped"?`${esc(idle)} · skipped`:esc(idle);
    if(test&&name==="output"&&cls==="waiting")label="Ready to play";
    let controls="";
    if(name==="tts"&&tts.metrics){
      const m=tts.metrics;
      const memory=m.vram_free_mib!=null?`${esc(m.vram_free_mib)} MiB VRAM free`:`${esc(m.peak_rss_mib)} MiB peak RAM`;
      const steps=m.steps?` · ${esc(m.steps)} steps`:"";
      controls=`<div class="hint">${esc((m.load_seconds+m.generation_seconds).toFixed(1))} s total · ${esc(m.audio_seconds)} s audio${steps} · ${memory}</div>`;
      if(tts.cpu_reason&&m.vram_free_mib==null)controls+=`<div class="hint">CPU because ${esc(tts.cpu_reason)}</div>`;
    }
    if(test&&!task.interrupt_requested&&name==="received"&&st?.status==="waiting"){
      const active=state.recording?.id===task.id,starting=state.starting===task.id;
      if(active){cls="recording";label="Recording…";}
      const disabled=!!state.starting||!!state.uploading||!!state.recording&&!active;
      controls=`<div class="stage-actions"><button class="btn ${active?"recording":""}" data-record="${esc(task.id)}" ${disabled?"disabled":""}>${icon(active?"square":"mic")}${active?"Stop recording":starting?"Opening microphone…":"Record"}</button></div><div class="hint">${active?"Click stop when finished · 60 second limit":"Record a message using your browser microphone"}</div>`;
    }
    if(test&&!task.interrupt_requested&&name==="output"&&by.tts?.status==="done"){
      const busy=st?.status==="loading",playing=state.playing===task.id;
      controls=`<div class="stage-actions"><button class="btn" data-cast="${esc(task.id)}" ${busy||playing?"disabled":""}>${icon("cast")}Cast to Nest</button><button class="btn" data-play="${esc(task.id)}" ${busy?"disabled":""}>${icon(playing?"square":"play")}${playing?"Stop":"Play"}</button></div>`;
      if(playing)label="Playing in browser…";
      if(out.last_error)controls+=`<div class="notice" role="status">${esc(out.last_error)}</div>`;
    }
    return {cls,label,controls,glyph:cls==="loading"?"loader-circle":glyph};
  });
}

function renderTasks(tasks=state.tasks){
  state.tasks=tasks;
  if(!tasks.length){$("tasks").innerHTML='<div class="card empty">No pipelines yet. Say “Hey Google, …” or click Test.</div>';return}
  const shown=state.showAll?tasks:tasks.slice(0,5);
  $("tasks").innerHTML=shown.map(task=>{
    const test=task.meta?.source==="browser_test";
    const flow=steps(task).map(s=>`<div class="step ${s.cls}"><div class="node">${icon(s.glyph)}</div><div class="step-content"><div class="label">${s.label}</div>${s.controls}</div></div>`).join("");
    const end=["done","error","interrupted"].includes(task.status)?secs(task.created,task.updated):"";
    const stop=["loading","waiting"].includes(task.status)?`<button class="icon" title="Interrupt" aria-label="Interrupt pipeline" data-stop="${esc(task.id)}">${icon("square")}</button>`:"";
    const err=task.error?`<div class="err" role="status">${esc(task.error.message)}</div>`:"";
    const message=state.messages.get(task.id);
    return `<article class="card task" data-task="${esc(task.id)}"><div class="task-top"><div class="task-info"><span class="task-kind">${icon(test?"flask-conical":"cast")}${test?"Test pipeline":"Nest pipeline"}</span><span>${clock(task.created)}${end?" · "+end:""}</span></div>${stop}</div><div class="flow">${flow}</div>${err}${message?`<div class="notice" role="status">${esc(message)}</div>`:""}</article>`;
  }).join("")+(tasks.length>5?`<button class="more" id="more">${state.showAll?"Show fewer":`Show all ${tasks.length}`}</button>`:"");
  document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>interrupt(b.dataset.stop));
  document.querySelectorAll("[data-record]").forEach(b=>b.onclick=()=>record(b.dataset.record));
  document.querySelectorAll("[data-cast]").forEach(b=>b.onclick=()=>action(b.dataset.cast,"cast"));
  document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>play(b.dataset.play));
  if($("more"))$("more").onclick=()=>{state.showAll=!state.showAll;renderTasks()};
}

async function api(path,body){
  const response=await fetch(path,{method:"POST",body});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Request failed");
  return data;
}
function message(id,error){state.messages.set(id,error.message||String(error));renderTasks()}
async function action(id,name,body){
  state.messages.delete(id);
  try{await api(`api/tests/${encodeURIComponent(id)}/${name}`,body);await refresh()}
  catch(error){message(id,error)}
}
async function interrupt(id){
  if(state.recording?.id===id){state.recording.cancelled=true;state.recording.recorder.stop()}
  if(state.playing===id)stopPlayer();
  try{await api(`api/tasks/${encodeURIComponent(id)}/interrupt`);await refresh()}
  catch(error){message(id,error)}
}
function stopPlayer(){player.pause();state.playing=null;renderTasks()}
function play(id){
  if(state.playing===id){stopPlayer();return}
  player.pause();state.playing=id;state.messages.delete(id);
  player.src=`api/tests/${encodeURIComponent(id)}/audio`;
  renderTasks();
  player.play().catch(error=>{if(state.playing===id){state.playing=null;message(id,error)}});
}
player.onended=()=>{const id=state.playing;state.playing=null;renderTasks();if(id)action(id,"browser")};
player.onerror=()=>{const id=state.playing;state.playing=null;if(id)message(id,new Error("Audio could not be played. Try again."))};
async function record(id){
  if(state.recording?.id===id){state.recording.recorder.stop();return}
  state.messages.delete(id);
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){message(id,new Error("Microphone access requires HTTPS or localhost. Open this monitor at http://localhost:53412 or via HTTPS."));return}
  if(!window.MediaRecorder){message(id,new Error("Recording is not supported in this browser."));return}
  state.starting=id;renderTasks();
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(!state.tasks.some(t=>t.id===id&&!t.interrupt_requested)) {stream.getTracks().forEach(t=>t.stop());return}
    const type=["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4"].find(t=>MediaRecorder.isTypeSupported(t));
    const recorder=new MediaRecorder(stream,type?{mimeType:type}:{});
    const current={id,recorder,stream,chunks:[],cancelled:false,timer:null};
    recorder.ondataavailable=e=>{if(e.data.size)current.chunks.push(e.data)};
    recorder.onerror=()=>{current.cancelled=true;message(id,new Error("Microphone recording failed. Please try again."));if(recorder.state!=="inactive")recorder.stop();else stream.getTracks().forEach(t=>t.stop())};
    recorder.onstop=async()=>{
      clearTimeout(current.timer);stream.getTracks().forEach(t=>t.stop());state.recording=null;
      if(current.cancelled){renderTasks();return}
      const audio=new Blob(current.chunks,{type:recorder.mimeType});
      if(!audio.size){message(id,new Error("No audio recorded. Please try again."));return}
      if(audio.size>32*1024*1024){message(id,new Error("Recording too large. Try a shorter message."));return}
      state.uploading=id;renderTasks();await action(id,"recording",audio);state.uploading=null;renderTasks();
    };
    state.recording=current;recorder.start(250);
    current.timer=setTimeout(()=>{if(recorder.state!=="inactive")recorder.stop()},MAX_RECORDING_MS);
  }catch(error){if(stream)stream.getTracks().forEach(t=>t.stop());message(id,error)}
  finally{state.starting=null;renderTasks()}
}
window.addEventListener("pagehide",()=>{const r=state.recording;if(r){r.cancelled=true;if(r.recorder.state!=="inactive")r.recorder.stop();r.stream.getTracks().forEach(t=>t.stop())}player.pause()});

function describe(e){
  const kb=n=>`${Math.round(n/1024)} KB`;
  switch(e.kind){
    case "local_bootstrap":return "Gave the Nest its local sign-in token";
    case "local_connectivity":return "Answered the Nest’s internet check";
    case "upstream_blocked":return `Blocked a Google request to ${e.host}`;
    case "s3_local_route":return "Nest connected to the voice endpoint";
    case "s3_control_reply":return e.service==="assistant-settings"?"Synced assistant settings with the Nest":`Answered the Nest’s ${e.service||"control"} request`;
    case "s3_endpoint":return e.decision==="no_speech"?"Nobody spoke, stopped listening":`You stopped speaking, stopped listening after ${e.audio} s`;
    case "s3_segments":return e.count?`Captured ${kb(e.bytes)} of audio`:null;
    case "s3_response":return `Replied ${e.text?`“${e.text}”`:"with audio"}`;
    case "s3_quiet_close":return "Closed the turn quietly";
    case "local_wake_only":return "Heard only the wake word";
    case "local_follow_on_noise":return `Ignored background noise “${e.text}”`;
    case "s3_query_error":return "Failed to answer: "+String(e.error||"").split("\n")[0];
    case "s3_send_error":return "Failed to send the reply to the Nest";
    case "s3_reset":return e.service&&e.service!=="assistant"?"Nest closed a background session":"Nest closed the voice session";
    case "s3_tls_error":return "A secure connection failed";
    case "s3_connection_error":return "Voice connection error";
    case "local_assistant_error":return "Assistant error";
    default:return e.kind.replace(/_/g," ");
  }
}

function requestIcon(e){
  if(/error/.test(e.kind))return "circle-alert";
  return ({local_bootstrap:"key-round",local_connectivity:"wifi",upstream_blocked:"shield-ban",s3_local_route:"wifi",s3_control_reply:"settings-2",s3_endpoint:"mic",s3_segments:"audio-lines",s3_response:"volume-2",s3_quiet_close:"circle-stop",local_wake_only:"mic",local_follow_on_noise:"audio-lines",s3_reset:"circle-stop"})[e.kind]||"text-align-start";
}
function renderRequests(events){
  const groups=[];
  for(const e of events){
    const what=describe(e),prev=groups[groups.length-1];
    if(!what)continue;
    if(prev&&prev.what===what){prev.count++;continue}
    groups.push({what,count:1,e,key:e.time+e.kind});
  }
  if(!groups.length){$("requests").innerHTML='<div class="empty">Nothing yet.</div>';return}
  $("requests").innerHTML=groups.map(g=>`<details data-key="${esc(g.key)}"${state.open.has(g.key)?" open":""}><summary>${icon("chevron-right","chevron")}${icon(requestIcon(g.e),"request-icon"+(/error/.test(g.e.kind)?" error":""))}<span class="what">${esc(g.what)}</span>${g.count>1?`<span class="count">×${g.count}</span>`:""}<span class="when">${clock(Date.parse(g.e.time)/1000)}</span></summary><pre>${esc(JSON.stringify(g.e,null,2))}</pre></details>`).join("");
  document.querySelectorAll("details").forEach(el=>el.addEventListener("toggle",()=>el.open?state.open.add(el.dataset.key):state.open.delete(el.dataset.key)));
}

function setStatus(cls,text){$("status").className="status "+cls;$("status-text").textContent=text}

async function refresh(){
  try{
    const [t,r]=await Promise.all([fetch("api/tasks").then(x=>x.json()),fetch("api/requests").then(x=>x.json())]);
    const ts=JSON.stringify(t.tasks),rs=JSON.stringify(r.requests);
    if(ts!==state.last.tasks){state.last.tasks=ts;renderTasks(t.tasks||[])}
    if(rs!==state.last.requests){state.last.requests=rs;renderRequests(r.requests||[])}
    setStatus(state.paused?"":"live",state.paused?"Paused":"Live");
  }catch{setStatus("down","Disconnected")}
}
function setPause(p){state.paused=p;$("pause").innerHTML=icon(p?"play":"pause");$("pause").setAttribute("aria-label",p?"Resume updates":"Pause updates");$("pause").title=p?"Resume":"Pause";if(!p)refresh();else setStatus("","Paused")}
$("pause").onclick=()=>setPause(!state.paused);
$("refresh").onclick=refresh;
$("refresh").innerHTML=icon("refresh-cw");
$("test").innerHTML=icon("flask-conical")+"Test";
$("test").onclick=async()=>{
  $("test").disabled=true;$("test-notice").textContent="";
  try{await api("api/tests");await refresh()}
  catch(error){$("test-notice").textContent=error.message}
  finally{$("test").disabled=false}
};
setPause(false);
setInterval(()=>{if(!state.paused)refresh()},1500);
</script>
</body>
</html>
